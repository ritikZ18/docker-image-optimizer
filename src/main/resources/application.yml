spring:
  application:
    name: docker-image-optimizer
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/imagesmith}
    username: ${DATABASE_USERNAME:imagesmith}
    password: ${DATABASE_PASSWORD:imagesmith}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
server:
  port: ${SERVER_PORT:8080}
